<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-base: #ffffff;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --primary: #4f46e5;
            --primary-hover: #3730a3;
            --primary-glow: rgba(79, 70, 229, 0.08);
            --font-family: 'Plus Jakarta Sans', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Login Card */
        .login-card {
            position: relative;
            z-index: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 48px 40px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            animation: floatUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes floatUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Avatar styling */
        .avatar-container {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
        }

        .avatar-img {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.06);
            transition: var(--transition);
        }

        .avatar-img:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 24px rgba(79, 70, 229, 0.15);
            border-color: var(--primary);
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 24px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 14px 14px 42px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .forgot-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-family: var(--font-family);
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 14px var(--primary-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 12px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.25);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* Bottom options */
        .footer-text {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 32px;
        }

        .footer-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .footer-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="avatar-container">
            <img src="avatar.png" alt="Profile Picture" class="avatar-img">
        </div>

        <form id="login-form" onsubmit="event.preventDefault(); handleLogin();">
            <div class="form-group">
                <div class="label-row">
                    <label class="form-label" for="email">Email address</label>
                </div>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 00-2 2z">
                            </path>
                        </svg>
                    </span>
                    <input class="form-input" type="email" id="email" required placeholder="Enter your email"
                        autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label class="form-label" for="password">Password</label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                            </path>
                        </svg>
                    </span>
                    <input class="form-input" type="password" id="password" required placeholder="••••••••"
                        autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btn-submit">
                <span>Sign In</span>
            </button>
        </form>

        <div class="footer-text">
            Don't have an account? <a href="#" class="footer-link">Sign up</a>
        </div>
    </div>

    <script>
        function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btnSubmit = document.getElementById('btn-submit');

            // Set loading state on submit button
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span>Signing In...</span>';

            setTimeout(() => {
                alert(`Logged in with: ${email}`);
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<span>Sign In</span>';
            }, 1000);
        }
    </script>
</body>

</html>
